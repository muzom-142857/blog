backend:
  name: github
  repo: muzom-142857/blog
  branch: main
  base_url: https://YOUR_RAILWAY_DOMAIN # TODO: fill in after first Railway deploy
  auth_endpoint: auth

local_backend: true # lets `npx decap-server` run the CMS against your local filesystem, no GitHub auth needed

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "posts_en"
    label: "Posts (EN)"
    folder: "src/content/en/posts"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "posts_ko"
    label: "Posts (KO)"
    folder: "src/content/ko/posts"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
