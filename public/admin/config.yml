backend:
  name: github
  repo: muzom-142857/blog
  branch: main
  # no OAuth proxy running anywhere (site is static-only on GitHub Pages), so
  # logging in from the live /admin/ page won't work. Use it locally instead:
  # `npx decap-server` + `npm run dev`, writes straight to the filesystem.

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "posts_en"
    label: "Posts (EN)"
    folder: "src/content/en/posts"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "posts_ko"
    label: "Posts (KO)"
    folder: "src/content/ko/posts"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
